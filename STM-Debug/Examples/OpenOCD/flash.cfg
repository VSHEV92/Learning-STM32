# --------------------------------------------------
# Select High Level Adapter interface
# Set speed to 500 kHz
adapter driver hla
adapter speed 500

# Select ST-Link as adapter
# Select USB as ST-Link connection
# Select USB VID/PID
hla_layout stlink      
hla_stlink_backend usb 
hla_vid_pid 0x0483 0x3744 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x374e 0x0483 0x374f 0x0483 0x3752 0x0483 0x3753 0x0483 0x3754

# Select SDW as transport
transport select hla_swd


# --------------------------------------------------
# Wait before deassert srst signal after assert it
# Wait before send next command after deassert srst signal
adapter srst pulse_width 100 
adapter srst delay       100

# Nucleo-F091RC board does not support tsrt
reset_config srst_only 


# --------------------------------------------------
# Also set ID of Cortex-M0 core
set _CHIPNAME stm32f091rc 
set CORTEX_M0_ID 0x0bb11477

# Declare DP on SWD transport
# Declare new DAP and configure
swd newdap $_CHIPNAME cpu -expected-id $CORTEX_M0_ID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -adiv5


# ------------------------------------------------
# Define target CPU, set it's type to Cortex-M and bind to DAP
set _TARGETNAME $_CHIPNAME.core
target create $_CHIPNAME.core cortex_m -dap $_CHIPNAME.dap

# Set Working Area 
$_TARGETNAME configure -work-area-phys 0x20000000 
$_TARGETNAME configure -work-area-size 0x1000
$_TARGETNAME configure -work-area-backup 0



# ------------------------------------------------
# ------------- Configure Flash ------------------
# ------------------------------------------------
set _FLASHNAME $_CHIPNAME.flash

# Set Flash parameters:
# - interface:  flash interface (external or internal). stm32f1x for F0, F1 and F2
# - base:       flash base address
# - size:       flash size in bytes, 0 - autodetect
# - chip_width: flash data interface width on bytes, 0 - autodetect
# - bus_width:  cpu data bus size in bytes, 0 - autodetect

set _FLASH_BASE 0x8000000
set _FLASH_SIZE 0
set _FLASH_CHIP_WIDTH 0
set _FLASH_BUS_WIDTH 0

flash bank $_FLASHNAME stm32f1x $_FLASH_BASE $_FLASH_SIZE $_FLASH_CHIP_WIDTH $_FLASH_BUS_WIDTH $_TARGETNAME


# We disable GDB, TCL and Telnet servers,
# because we will not use them
tcl_port disabled
telnet_port disabled
gdb_port disabled


# ------------------------------------------------
# ----------------- Probe Flash ------------------
# ------------------------------------------------

# Finish configuration phase
init

# Print flash info
flash banks

# Probe flash bank
flash probe 0
