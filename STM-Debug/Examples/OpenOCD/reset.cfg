
# Next configure debug adapter 

# Select High Level Adapter interface
# Set speed to 500 kHz
adapter driver hla
adapter speed 500

# Select ST-Link as adapter
# Select USB as ST-Link connection
hla_layout stlink      
hla_stlink_backend usb 

# Select SDW as transport
transport select hla_swd

# Now we will configure resets
# OpenOCD has to reset signals:
#   - srst - System reset. Resets all system accept Debug module
#   - trst - Debug Reset. Resets Debug module only


# ---------------------------------------------------------
# 1. We can configure resets delays for both signals in msec

# Set how long OpenOCD wait before deassert srst signal after assert it
# Set how long OpenOCD wait before send next command after deassert srst signal
adapter srst pulse_width 1 
adapter srst delay       2

# Nuclo-F091RC does not has TRST signal so we not configure this delays
# jtag_ntrst_assert_width 1    # set how long OpenOCD wait before deassert trst signal after assert it 
# jtag_ntrst_delay        2    # set how long OpenOCD wait before send next command after deassert trst signal


# ---------------------------------------------------------
# 2. We can configure board resets settings

# Is board support srst, tsrt or both
reset_config srst_only 

# Nuclo-F091RC does not has TRST signal so we not configure this settings
# reset_config srst_nogate             # Does assertion of srst may cause Debug module will not available
# reset_config connect_deassert_srst   # What value of srst should be used after connection to the target 
# reset_config separate                # Is srst and trst as saparate of assertion of one signal cause assert of other signal 

# ---------------------------------------------------------
# 3. We can configure some reset event callbacks

# jtag_arp_init - reset debug module using JTAG TAP FSM. Then check JTAG ID and other it's settings
# jtag_arp_init_reset - use called to try reset chip using srts and trst


# init_reset - call at the begining of reset phase
#              usually it call jtag_arp_init_reset
proc init_reset { mode } {
    puts "Hello from OpenOCD"
    jtag_arp_init_reset $mode
}


# First we disable TCL and Telnet servers,
# because we will not use them
tcl_port disabled
telnet_port disabled


# At the end of this script we get error, because 
# we don't configure TAP or DAP

