# This example show how configure Adapter
# As example Nucleo-F091RC board is user
# This board has buildin ST-Link adapter


# ----------------------------------------------------------------
# 1. Select adapter driver 
#    ST-Link in our case

# adapter driver st-link 
# this command may not support SWD transport 
# So we can use High Level Adapter Interface insteed
adapter driver hla
hla_layout stlink

# ----------------------------------------------------------------
# 2. We can configure which interface will be used for
#    adapter connection (USB, TCP or other)
hla_stlink_backend usb

# ----------------------------------------------------------------
# 3. If needed we select which transport to use (JTAG or others)
#    Our board support only SWD interface

# adapter transports swd - modify set of allowed transports

# older version of OpenOCD don't support SWD (openocd control each bit)
# so we use hla_swd (High Level Adapter - openocd only send commands to adapter)
transport select hla_swd

# ----------------------------------------------------------------
# 4. We can configure adapter clock frequency in KHz
#    We set speed to 500 kHz
adapter speed 500


# ----------------------------------------------------------------
# 5. We can also configure following features to help
#    OpenOCD select adapter device and perform some checks

# adapter usb vid_pid 0xXXXX 0xXXXX - which USB VID and PID search to find adapter
# adapter usb location X-X.X        - set concrete USB device as adapter by USB BUS-PORT.SUBPORT
# adapter usb product_name NAME     - which USB Product Name (coded by VID/PID) to find adapter
# adapter serial XXXXXXXXXXX        - check debug adapter serial number after connection


# Disable TCL and Telnet servers, because we don't use them
tcl_port disabled
telnet_port disabled

# Get current adapter and print is't name
puts "Current adapter interface is: [adapter name]"


# At the end of this script we get error, because 
# we don't configure TAP or DAP
