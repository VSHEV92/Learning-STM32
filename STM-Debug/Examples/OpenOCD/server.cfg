# We can increment debug verbosity
# to get more messages from OpenOCD
# Level 2 (default) - errors, warnings, infos
# Level 3 show debug message also
debug_level 3

# Default OpenOCD opens TCL and Telnet ports
# TCL - for machine commnads
# Telnet - for human

# We can disable TCL if we don't need it
tcl_port disabled

# We can change Telnet port if we needed
telnet_port 2222

# OpenOCD will not call init function 
# at the end of the script, so configure phase
# not ended.

# Without this command we get error, because 
# we don't specify adapter
noinit

# We can wait a few seconds just for example
# sleep get msec as parameter
sleep 500

