# --------------------------------------------------
# Select High Level Adapter interface
# Set speed to 500 kHz
adapter driver hla
adapter speed 500

# Select ST-Link as adapter
# Select USB as ST-Link connection
hla_layout stlink      
hla_stlink_backend usb 

# Select SDW as transport
transport select hla_swd


# --------------------------------------------------
# Wait before deassert srst signal after assert it
# Wait before send next command after deassert srst signal
adapter srst pulse_width 1 
adapter srst delay       2

# Nucleo-F091RC board does not support tsrt
reset_config srst_only 


# --------------------------------------------------
# ---------------- TAP Configuration ---------------
# --------------------------------------------------

# Nucleo-F091RC board support SWD only
# So we don't configure TAP

# $_CHIPNAME is conventional TAP/DAP chip configuration name
# set _CHIPNAME stm32f091rc 


# jtag newtap $_CHIPNAME cpu                       # Declare new TAP controller of STM32 CPU
# jtag configure $_CHIPNAME.cpu -enable            # TAP linked to Scan Chain After TSRT
# jtag configure $_CHIPNAME.cpu -irlen X           # Number of bits in instruction register
# jtag configure $_CHIPNAME.cpu -expected-id XXXX  # Expected value of IDCODE register, used to verify TAP
# jtag configure $_CHIPNAME.cpu -ircapture X       # Pattern loaded by TAP in IRCAPTURE state, used to verify TAP
# jtag configure $_CHIPNAME.cpu -irmask X          # Mask to check IRCAPTURE Pattern, used to verify TAP


# --------------------------------------------------
# ---------------- DAP Configuration ---------------
# --------------------------------------------------

# $_CHIPNAME is conventional TAP/DAP chip configuration name
# Also set ID of Cortex-M0 core
set _CHIPNAME stm32f091rc 
set CORTEX_M0_ID 0x0bb11477

# Declare DP on SWD transport
swd newdap $_CHIPNAME cpu -expected-id $CORTEX_M0_ID

# Declare new DAP and configure
# -adiv5               - Use ADI v5 Specification
# -adiv6               - Use ADI v6 Specification
# -ignore-syspwrupack  - don't check SYS Power Ack bit after request 
# -dp-id               - used in multidrop. write to TARGETSEL, Equal to TARGETID register
# -instance-id         - used in multidrop. write to TARGETSEL, Equal to DLPIDR register
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu -adiv5


# We disable TCL and Telnet servers,
# because we will not use them
tcl_port disabled
telnet_port disabled
